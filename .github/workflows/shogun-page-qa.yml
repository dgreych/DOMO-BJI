name: shogun page qa

on:
  push:
    branches:
      - main
    paths:
      - 'shogun/**'
      - 'tests/shogun-*.test.mjs'
      - 'sitemap.xml'
      - '.github/workflows/shogun-page-qa.yml'
  pull_request:
    paths:
      - 'shogun/**'
      - 'tests/shogun-*.test.mjs'
      - 'sitemap.xml'
      - '.github/workflows/shogun-page-qa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/shogun-*.test.mjs