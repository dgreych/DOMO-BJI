name: F09 Jair URL Check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  jair-url:
    if: ${{ !contains(github.event.head_commit.message, '[skip f09-jair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate Jair public URL
        run: |
          set -euo pipefail
          url='https://dgreych.github.io/DOMO-BJI/demos/jair-neto/'
          body="$(curl -fsSL "$url")"
          grep -Fq '<title>Jair Neto' <<<"$body"
          grep -Fq 'https://dgreych.github.io/DOMO-BJI/demos/jair-neto/og.png' <<<"$body"
          curl -fsSI 'https://dgreych.github.io/DOMO-BJI/demos/jair-neto/og.png' >/dev/null
          echo 'JAIR_URL_LIVE_VERIFIED'
