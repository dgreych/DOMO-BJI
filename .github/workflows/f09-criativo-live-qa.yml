name: F09 Criativo live QA

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    if: ${{ !contains(github.event.head_commit.message, '[skip f09-criativo-qa]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh 6 tests
        run: node --test tests/criativo-briefing.test.mjs tests/jair-briefing.test.mjs

      - name: Install QA runtime
        run: npm install --prefix /tmp/f09qa --no-save playwright-core@1.55.0

      - name: Wait for corrected Pages content
        run: |
          set -euo pipefail
          url='https://dgreych.github.io/DOMO-BJI/demos/criativo-design/'
          for i in {1..40}; do
            if body="$(curl -fsS "$url" 2>/dev/null)" \
              && grep -Fq 'Identidade visual atribuída à Criativo Design' <<<"$body" \
              && grep -Fq '>Instagram ↗</a>' <<<"$body"; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: QA V3 live
        env:
          QA_URL: https://dgreych.github.io/DOMO-BJI/demos/criativo-design/
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          CHROME="$chrome" node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('/tmp/f09qa/node_modules/playwright-core');
          const url = process.env.QA_URL;
          const expectedPath = '/DOMO-BJI/demos/criativo-design/';
          const viewports = [{width:360,height:800},{width:390,height:844},{width:430,height:932},{width:1440,height:900}];
          (async () => {
            const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox']});
            const measurements=[];
            for (const viewport of viewports) {
              const context=await browser.newContext({viewport});
              const page=await context.newPage();
              const consoleErrors=[], pageErrors=[], requestFailures=[];
              page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('requestfailed',r=>requestFailures.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
              const response=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
              assert(response&&response.ok(),`HTTP ${viewport.width}: ${response?.status()}`);
              assert.equal(new URL(page.url()).pathname,expectedPath);
              const dims=await page.evaluate(()=>({innerWidth,docScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth}));
              assert(dims.docScrollWidth<=dims.innerWidth+1,`overflow doc ${viewport.width}`);
              assert(dims.bodyScrollWidth<=dims.innerWidth+1,`overflow body ${viewport.width}`);
              const broken=await page.locator('img').evaluateAll(xs=>xs.filter(x=>!x.complete||x.naturalWidth===0).map(x=>x.getAttribute('src')));
              assert.deepEqual(broken,[]);
              const badAnchors=await page.locator('a[href^="#"]').evaluateAll(xs=>xs.map(x=>x.getAttribute('href')).filter(h=>h&&h!=='#'&&!document.querySelector(h)));
              assert.deepEqual(badAnchors,[]);
              const primary=page.locator('[data-primary-cta]');
              assert.equal(await primary.count(),1);
              await primary.scrollIntoViewIfNeeded();
              assert(await primary.isVisible());
              assert.deepEqual(consoleErrors,[]);
              assert.deepEqual(pageErrors,[]);
              assert.deepEqual(requestFailures,[]);
              measurements.push({viewport,...dims});
              await context.close();
            }
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            await page.goto(url,{waitUntil:'networkidle'});
            assert.equal(await page.title(),'Criativo Design — Do arquivo à rua | Conceito digital');
            assert.equal(await page.locator('link[rel="canonical"]').getAttribute('href'),url);
            assert.equal(await page.locator('meta[property="og:type"]').getAttribute('content'),'website');
            const og=await page.locator('meta[property="og:image"]').getAttribute('content');
            assert.equal(og,`${url}og.png`);
            assert.equal(await page.locator('meta[property="og:url"]').getAttribute('content'),url);
            assert.equal(await page.locator('meta[name="twitter:card"]').getAttribute('content'),'summary_large_image');
            const ogResponse=await context.request.get(og);
            assert(ogResponse.ok());
            assert.match(ogResponse.headers()['content-type']||'',/^image\/png/);
            const b=await ogResponse.body();
            assert.equal(b.slice(1,4).toString('ascii'),'PNG');
            assert.equal(b.readUInt32BE(16),1200);
            assert.equal(b.readUInt32BE(20),630);
            const cta=page.locator('[data-primary-cta]');
            assert.equal(await cta.getAttribute('aria-disabled'),'true');
            await page.selectOption('#category',{label:'Letreiro / fachada'});
            await page.selectOption('#material',{label:'ACM'});
            await page.fill('#measure','2,00 m × 0,80 m');
            await page.fill('#quantity','1');
            await page.fill('#location','fachada da loja');
            await page.fill('#objective','comunicar a nova identidade');
            await page.selectOption('#reference',{label:'Sim'});
            await page.locator('#reference').dispatchEvent('input');
            await page.waitForTimeout(100);
            assert.equal(await cta.getAttribute('aria-disabled'),null);
            const href=await cta.getAttribute('href');
            assert(href&&href.startsWith('https://wa.me/5522997085286?text='));
            const msg=new URL(href).searchParams.get('text')||'';
            for(const s of ['Categoria: Letreiro / fachada','Material de interesse: ACM','Medidas aproximadas: 2,00 m × 0,80 m','Quantidade: 1','Local de instalação ou aplicação: fachada da loja','Objetivo: comunicar a nova identidade','Tenho um arquivo ou referência para enviar: Sim']) assert(msg.includes(s),s);
            await context.close();
            const reduced=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
            const rp=await reduced.newPage();
            await rp.goto(url,{waitUntil:'networkidle'});
            const rc=rp.locator('[data-primary-cta]');
            await rc.scrollIntoViewIfNeeded();
            assert(await rc.isVisible());
            assert.equal(await rp.locator('main').count(),1);
            await reduced.close();
            await browser.close();
            console.log(JSON.stringify({status:'PASS_AUTOMATED',viewports:measurements,og:'1200x630',cta:'PASS',reducedMotion:'PASS'},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
