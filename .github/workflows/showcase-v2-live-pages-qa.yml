name: Showcase V2 Live Pages QA

on:
  push:
    branches:
      - front/f13-vitrine-domo
    paths:
      - '.github/workflows/showcase-v2-live-pages-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium
      - name: Open real GitHub Pages and run browser QA
        env:
          SHOWCASE_BASE_URL: https://dgreych.github.io/DOMO-BJI/
        run: node tests/showcase-v2-browser-qa.mjs
      - name: Upload live screenshots and report
        uses: actions/upload-artifact@v4
        with:
          name: showcase-v2-live-pages-qa
          path: qa/showcase-v2/
          if-no-files-found: error
