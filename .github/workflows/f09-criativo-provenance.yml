name: F09 Criativo provenance

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  provenance:
    if: ${{ !contains(github.event.head_commit.message, '[skip f09-provenance]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published asset hash and factual hardening
        run: |
          set -euo pipefail
          expected='925aa513b85f14ddc75f5d9fdc81ef4ab18afa701ac628df753855fb2c47b3c5'
          actual="$(sha256sum demos/criativo-design/assets/brand-cover.webp | awk '{print $1}')"
          printf 'brand-cover sha256=%s\n' "$actual"
          test "$actual" = "$expected"
          grep -Fq 'Identidade visual atribuída à Criativo Design' demos/criativo-design/index.html
          grep -Fq '>Instagram ↗</a>' demos/criativo-design/index.html
          ! grep -Fq 'Identidade visual publicada pela Criativo Design' demos/criativo-design/index.html
          ! grep -Fq '>Instagram oficial ↗</a>' demos/criativo-design/index.html
