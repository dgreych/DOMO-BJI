name: Showcase V2 Contract

on:
  push:
    branches:
      - front/f13-vitrine-domo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Showcase V2 contract
        run: node --test tests/showcase-v2-foundation.test.mjs
      - name: Run existing repository tests
        run: node --test tests/*.test.mjs
