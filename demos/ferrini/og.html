<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>Ferrini — OG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0d0c;color:#f2f0e9;font-family:Arial,Helvetica,sans-serif}.card{position:relative;width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 84% 24%,rgba(217,255,67,.18),transparent 26%),linear-gradient(135deg,#111612,#090b0a 72%)}.grid{position:absolute;inset:0;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:54px 54px}.brand{position:relative;display:flex;align-items:center;gap:15px;font-weight:900;letter-spacing:.16em;font-size:22px}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#d9ff43;color:#0b0d0c;font-size:26px;transform:rotate(-8deg)}.copy{position:relative;max-width:920px}.kicker{margin:0 0 18px;color:#d9ff43;font-size:18px;letter-spacing:.18em;font-weight:900;text-transform:uppercase}.copy h1{margin:0;font-family:Impact,'Arial Narrow Bold',sans-serif;font-size:112px;line-height:.84;letter-spacing:-.035em}.copy h1 em{color:#d9ff43;font-style:normal}.copy p{margin:26px 0 0;max-width:760px;color:#cdd0c9;font-size:27px;line-height:1.35}.footer{position:relative;display:flex;justify-content:space-between;align-items:end;color:#aeb4ab;font-size:18px}.footer strong{color:#f2f0e9}.number{position:absolute;right:40px;top:-86px;font-family:Impact,sans-serif;font-size:420px;letter-spacing:-.08em;color:transparent;-webkit-text-stroke:1px rgba(242,240,233,.11)}
</style>
</head>
<body>
<div class="card" data-og-card>
  <div class="grid" aria-hidden="true"></div>
  <div class="number" aria-hidden="true">03</div>
  <div class="brand"><span class="mark">F</span><span>FERRINI</span></div>
  <div class="copy"><p class="kicker">objetivo · experiência · período</p><h1>COMECE PELO<br>SEU <em>TREINO.</em></h1><p>Organize seu ponto de partida antes da conversa com a equipe.</p></div>
  <div class="footer"><strong>Bom Jesus do Itabapoana · RJ</strong><span>Demonstração conceitual</span></div>
</div>
</body>
</html>
