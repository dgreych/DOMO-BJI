  <title id="title">Domo — Do improviso ao fluxo</title>
  <desc id="desc">Cartão social da Domo, software sob medida para negócios reais.</desc>
  <defs>
    <radialGradient id="aurora" cx="0" cy="0" r="1" gradientTransform="translate(990 40) rotate(132) scale(650)"><stop stop-color="#18C8FF" stop-opacity=".42"/><stop offset=".42" stop-color="#2865FF" stop-opacity=".18"/><stop offset="1" stop-color="#080F1D" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18C8FF"/><stop offset="1" stop-color="#793CFF"/></linearGradient>
