  <style>
    :root { color-scheme: dark; --bg: #090b10; --ink: #ece3d5; --gold: #c3ac8b; }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body { min-height: 100vh; min-height: 100svh; margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .sky {

    }
    .sky::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 25%;

      border-top: 1px solid rgba(218,221,215,.055);
    }
    .frame { width: min(100% - 42px, 1000px); margin: 0 auto; position: relative; z-index: 1; }

    .line { width: 1px; height: 55px; margin: 37px auto 0; background: linear-gradient(rgba(206,178,141,.86), transparent); }
    .reader { margin: 0 auto 60px; max-width: 950px; padding: clamp(8px, 2vw, 18px); border: 1px solid rgba(212,190,159,.28); background: rgba(6,8,12,.42); box-shadow: 0 40px 100px rgba(0,0,0,.25); }
    .reader iframe { width: 100%; height: 920px; display: block; border: 0; background: #f6f3ed; }
    .link { display: inline-flex; align-items: center; gap: 11px; padding: 16px 1px; color: #e0c5a0; border-bottom: 1px solid rgba(206,178,141,.5); text-decoration: none; text-transform: uppercase; font-size: 11px; letter-spacing: .19em; transition: color .2s, gap .2s; }
    .link:hover { color: #fff; gap: 17px; }
    .link:focus-visible { outline: 2px solid #dec5a2; outline-offset: 6px; }
    .foot { padding: 0 0 60px; text-align: center; }

      .reader { padding: 5px; margin-bottom: 35px; }
      .reader iframe { height: 1010px; }
      .foot { padding-bottom: 35px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
