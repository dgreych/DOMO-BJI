<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030303">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Para todos os efeitos, eu não existo mais em lugar algum pra além das suas memórias.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="...">
  <meta property="og:description" content="Para todos os efeitos, eu não existo mais em lugar algum pra além das suas memórias.">
  <title>...</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: #030303; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: #030303;
      color: #e8e4df;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 62% 55% at 50% 46%, #121110 0%, #080808 49%, #030303 100%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .12;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.014) 3px 4px);
    }
    main {
      position: relative;
      z-index: 1;
      width: min(100%, 1100px);
      padding: clamp(64px, 9vh, 112px) clamp(28px, 7vw, 90px);
      text-align: center;
      isolation: isolate;
    }
    .rule {
      display: block;
      width: 1px;
      height: 55px;
      margin-inline: auto;
      background: linear-gradient(to bottom, transparent, rgba(215,207,196,.46));
      transform-origin: center;
    }
    .opening {
      margin: clamp(40px, 6vh, 66px) 0 26px;
      color: #b8b0a9;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(13px, 1.55vw, 17px);
      font-weight: 300;
      letter-spacing: .055em;
      line-height: 1.8;
    }
    h1 {
      max-width: 960px;
      margin: 0 auto;
      font-family: "Iowan Old Style", "Baskerville", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: clamp(40px, 6.5vw, 84px);
      font-weight: 400;
      letter-spacing: -.044em;
      line-height: 1.14;
      text-wrap: balance;
    }
    h1 span {
      display: block;
      color: #cbc4bb;
      font-style: italic;
      font-weight: 400;
      letter-spacing: -.05em;
    }
    .closing {
      margin: 33px 0 clamp(48px, 7vh, 78px);
      color: #a6a09a;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(16px, 1.8vw, 20px);
      font-weight: 300;
      letter-spacing: .015em;
      line-height: 1.7;
    }
    .closing em {
      color: #e6dfd5;
      font-family: "Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, serif;
      font-size: 1.22em;
      font-weight: 400;
    }
    .rule.bottom {
      height: 35px;
      background: linear-gradient(to bottom, rgba(215,207,196,.36), transparent);
    }
    .rule, .opening, h1, .closing {
      animation: appear 1.45s cubic-bezier(.22, 1, .36, 1) both;
    }
    .opening { animation-delay: .16s; }
    h1 { animation-delay: .36s; }
    .closing { animation-delay: .63s; }
    .rule.bottom { animation-delay: .85s; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(13px); filter: blur(3px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @media (max-width: 600px) {
      main { padding-inline: 25px; }
      .rule { height: 38px; }
      .opening { margin-top: 36px; margin-bottom: 20px; }
      h1 { font-size: clamp(39px, 10.4vw, 57px); line-height: 1.19; }
      .closing { margin-top: 27px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rule, .opening, h1, .closing { animation: none; }
    }
  </style>
</head>
<body>
  <main aria-label="Mensagem">
    <span class="rule" aria-hidden="true"></span>
    <p class="opening">Para todos os efeitos,</p>
    <h1>eu não existo mais <span>em lugar algum</span></h1>
    <p class="closing">pra além das suas <em>memórias.</em></p>
    <span class="rule bottom" aria-hidden="true"></span>
  </main>
</body>
</html>
